site_name: LM Knowledge Base
site_description: >-
  DFlash2 draft training: a Stage-2 walkthrough and the Whittle experiment
  history, with formulas, configurations and measured results.
site_url: https://biscet.github.io/lm-docs/
repo_url: https://github.com/biscet/lm-docs
repo_name: biscet/lm-docs
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra:
  alternate:
    - name: English
      link: /
      lang: en
    - name: Русский
      link: /ru/
      lang: ru

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Русский
          build: true
          site_name: База знаний по LLM
          site_description: >-
            Обучение draft-модели DFlash2: разбор Stage-2 и история опытов
            Whittle с формулами, конфигурациями и результатами.
          theme:
            language: ru
          nav_translations:
            Home: Главная
            Overview: Обзор
            What DFlash2 trains: Что обучает DFlash2
            Notation: Обозначения
            End-to-end pipeline: Полный конвейер
            Training data: Обучающие данные
            Target generation: Генерация target
            Feature capture: Захват признаков
            Feature projection: Проекция признаков
            Anchors and masked blocks: Anchor и маскированный блок
            Anchor sampling: Выбор anchor
            Context window: Окно контекста
            Draft architecture: Архитектура draft
            Layer stack: Стек слоёв
            Attention: Attention
            MLP: MLP
            Dynamic convolutions: Динамические свёртки
            Output head and top-16: Output head и top-16
            Objective: Функция потерь
            Cross-entropy: Cross-entropy
            Selector scoring: Скоринг селектора
            Selector loss: Loss селектора
            Total loss: Общий loss
            Full-vocabulary forward KL: Forward KL по всему словарю
            Optimization: Оптимизация
            Gradient clipping: Gradient clipping
            AdamW: AdamW
            Learning rate: Learning rate
            Mixed precision: Mixed precision
            Validation: Валидация
            Offline metrics: Offline-метрики
            Prefix proxy: Prefix proxy
            Validation windows: Окна валидации
            Training positions: Обучающие позиции
            Self-conditioned evaluation: Self-conditioned оценка
            Multi-anchor analysis: Несколько anchor
            Averaging over anchors: Усреднение по anchor
            Expected coverage: Ожидаемое покрытие
            Runtime and benchmark: Runtime и бенчмарк
            Greedy verification: Greedy-проверка
            Speculative sampling: Speculative sampling
            Acceptance rate: Acceptance
            Speedup model: Модель ускорения
            Benchmark setup: Постановка бенчмарка
            Paired bootstrap: Парный bootstrap
            Loss and accuracy deltas: Изменения loss и accuracy
            Training workflow: Рабочий процесс
            Checkpoint selection: Выбор checkpoint
            Feature storage: Хранение признаков
            Optimizer state memory: Память оптимизатора
            Export and rounding: Экспорт и округление
            Selection across experiments: Отбор в разных опытах
            Weight seed and resume: Начальные веса и resume
            Whittle experiments: Эксперименты Whittle
            Experiment map: Карта экспериментов
            Shared training setup: Общая конфигурация обучения
            LoRA pilot: LoRA-пилот
            "Project v1: full training": "Project v1: полное обучение"
            "OpenMix v2: replay": "OpenMix v2: replay"
            "DatasetDflash v3: shards": "DatasetDflash v3: шарды"
            Stage-2 supplement: Дополнение Stage-2
            "Dense8: eight anchors": "Dense8: восемь anchor"
            Uniform vs D-PACE: Uniform и D-PACE
            Selector-only pilot: Selector-only пилот
            Long selector training: Долгое обучение селектора
            Partial unfreeze: Partial unfreeze
            Hard CE vs forward KL: Hard CE против forward KL
            Coach archive and sources: Архив Coach и источники
            Dataset: Датасет
            Mixing: Смесь
            Splits and leakage: Сплиты и утечки
            Reference: Справочник
            One training step: Один шаг обучения
            What formulas cannot tell: Чего формулы не говорят
            Sources: Источники

extra_css:
  - assets/stylesheets/katex.min.css
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/katex.min.js
  - assets/javascripts/auto-render.min.js
  - assets/javascripts/math.js
  - assets/javascripts/mermaid.min.js
  - assets/javascripts/diagrams.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

